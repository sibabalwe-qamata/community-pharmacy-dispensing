server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Same-origin API: the browser calls /api/v1/..., nginx forwards to the API service.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Angular routes are client-side, so unknown paths must return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
